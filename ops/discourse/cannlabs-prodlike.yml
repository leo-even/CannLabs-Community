## CannLabs Community production-like proof (Task 37B.1). Synthetic values only.
## Derived from samples/standalone.yml at the pinned discourse_docker revision.
## Deliberate differences from the sample:
##  - no 443 / TLS (synthetic hostname, no public exposure); port 80 published on loopback only
##  - joins the dedicated cannlabs-prodlike-net Docker network (Mailpit SMTP is reachable only there)
##  - SMTP is Mailpit, no credentials
##  - docker_manager is not cloned (unpinned plugin; its UI upgrade path would bypass the pins)
##  - the CannLabs fork is built at an exact commit and the Qualified Access plugin at an exact commit
##  - nginx logs are hardened (Task 37B.1): redacted access log, error_log emerg, 0640 files / 0750 dirs,
##    Docker json-file rotation; see the run: section

templates:
  - "templates/postgres.template.yml"
  - "templates/redis.template.yml"
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"

expose:
  - "127.0.0.1:80:80"

docker_args: "--network cannlabs-prodlike-net --log-opt max-size=10m --log-opt max-file=3"

params:
  db_default_text_search_config: "pg_catalog.english"
  version: 73b2484ded24d04c874de49a328e76d10f226be4

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_HOSTNAME: "community-prodlike.test"
  DISCOURSE_SMTP_ADDRESS: mailpit
  DISCOURSE_SMTP_PORT: 1025
  DISCOURSE_SMTP_ENABLE_START_TLS: "false"

volumes:
  - volume:
      host: /var/discourse/shared/standalone
      guest: /shared
  - volume:
      host: /var/discourse/shared/standalone/log/var-log
      guest: /var/log

hooks:
  before_code:
    - exec:
        cd: $home
        cmd:
          - sudo -H -E -u discourse git remote set-url origin https://github.com/leo-even/CannLabs-Community.git
  after_code:
    - exec:
        cd: $home/plugins
        cmd:
          - sudo -H -E -u discourse git clone https://github.com/leo-even/CannLabs-Community-Qualified-Access.git cannlabs-community-qualified-access
          - sudo -H -E -u discourse git -C cannlabs-community-qualified-access -c advice.detachedHead=false checkout ca4f0070d7bf85e42dbfa7f8736469139bb20275

run:
  - exec: echo "Beginning of custom commands"

  # ---- CannLabs Community: request secrets must not reach nginx logs (Task 37B.1) -------------
  # Access log: method + redacted path + protocol. No query string. Referer reduced to its origin.
  # Error log: emerg only. Every nginx error_log line below emerg can carry the request line, the
  # upstream URI (with its query) and the Referer, and the format cannot be changed.
  # pups `replace` is silent when its pattern does not match, so each step has a guard that fails
  # the build when the stock config is not what was reviewed, and again when the result is not safe.

  # Guards on the stock config (drift check). Each fails the build.
  - exec:
      cmd:
        - |-
          test "$(grep -c '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf)" = 1 || { >&2 echo 'CannLabs guard: expected exactly one log_discourse format'; exit 1; }
        - |-
          test "$(grep '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf | grep -oF '"$request"' | wc -l)" = 1 || { >&2 echo 'CannLabs guard: stock "$request" not found exactly once in log_discourse'; exit 1; }
        - |-
          test "$(grep '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf | grep -oF '"$http_referer"' | wc -l)" = 1 || { >&2 echo 'CannLabs guard: stock "$http_referer" not found exactly once in log_discourse'; exit 1; }
        - |-
          test -z "$(grep -hE '^[[:space:]]*access_log[[:space:]]' /etc/nginx/conf.d/discourse.conf | grep -vE 'access_log off;|log_discourse;')" || { >&2 echo 'CannLabs guard: an unexpected access_log format is active in discourse.conf'; exit 1; }
        - |-
          test "$(grep -rhE '^[[:space:]]*error_log[[:space:]]' /etc/nginx)" = 'error_log /var/log/nginx/error.log;' || { >&2 echo 'CannLabs guard: the active error_log directives are not exactly the reviewed stock line'; exit 1; }
        - |-
          test "$(grep -c 'create 0644 www-data www-data' /etc/logrotate.d/nginx)" = 1 || { >&2 echo 'CannLabs guard: stock nginx logrotate create mode not found exactly once'; exit 1; }

  # Server outlet: the log variables. Credential-bearing core routes become [FILTERED] and keep a
  # format suffix such as .json. These mirror CannlabsPathSecretRedaction::RULES in the app.
  - file:
      path: /etc/nginx/conf.d/outlets/server/35-cannlabs-log-redaction.conf
      contents: |
        set $cannlabs_log_uri $uri;
        if ($uri ~ "^(/(?:u|users)/(?:password-reset|confirm-email-token|activate-account|confirm-old-email|confirm-new-email|confirm-admin)/)[^/.]+(.*)$") { set $cannlabs_log_uri "$1[FILTERED]$2"; }
        if ($uri ~ "^(/session/(?:email-login|otp)/)[^/.]+(.*)$") { set $cannlabs_log_uri "$1[FILTERED]$2"; }
        if ($uri ~ "^(/associate/)[^/.]+(.*)$") { set $cannlabs_log_uri "$1[FILTERED]$2"; }
        if ($uri ~ "^(/invites/(?:show/)?)[^/.]+(.*)$") { set $cannlabs_log_uri "$1[FILTERED]$2"; }
        if ($uri ~ "^(/email/unsubscribe/)[^/.]+(.*)$") { set $cannlabs_log_uri "$1[FILTERED]$2"; }
        set $cannlabs_log_referer "-";
        if ($http_referer ~ "^(https?://[^/?#]+)") { set $cannlabs_log_referer $1; }

  - replace:
      filename: /etc/nginx/conf.d/discourse.conf
      from: '"$request"'
      to: '"$request_method $cannlabs_log_uri $server_protocol"'

  - replace:
      filename: /etc/nginx/conf.d/discourse.conf
      from: '"$http_referer"'
      to: '"$cannlabs_log_referer"'

  # Error log severity: exact stock line only. emerg is the only level whose request-context lines
  # are structurally absent (error, crit and alert leak under upstream failure, rate limiting,
  # try_files EACCES and fd exhaustion).
  - replace:
      filename: /etc/nginx/nginx.conf
      from: 'error_log /var/log/nginx/error.log;'
      to: 'error_log /var/log/nginx/error.log emerg;'

  # New nginx logs 0640 (existing logs are not touched). Retention stays at the stock 7.
  - replace:
      filename: /etc/logrotate.d/nginx
      from: 'create 0644 www-data www-data'
      to: 'create 0640 www-data www-data'

  # Log directories hold request-derived data: not world-readable. Exact directories, no -R. The
  # parent log directory is left alone: discourse (uid 1000) and www-data reach /shared/log/rails
  # through it.
  # They are CREATED here, not assumed. /var/log is a bind mount of the persistent log/var-log, which is
  # empty on a fresh /shared and hides the image's /var/log/nginx. Stock runit (00-fix-var-logs) only
  # recreates it when the container starts, after this step, so a bare chmod fails the build on a fresh
  # install (found by the Task 37B.2B zero-state rebuild). install -d is idempotent and sets owner and
  # mode in one step: www-data:www-data for nginx (what 00-fix-var-logs sets) and discourse:www-data for
  # Rails (what web.template.yml sets).
  - exec: install -d -m 0750 -o www-data -g www-data /var/log/nginx
  - exec: install -d -m 0750 -o discourse -g www-data /shared/log/rails

  # Guards on the result. Each fails the build.
  - exec:
      cmd:
        - |-
          grep '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf | grep -qF '"$request_method $cannlabs_log_uri $server_protocol"' || { >&2 echo 'CannLabs guard: safe request representation is not in log_discourse'; exit 1; }
        - |-
          ! grep '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf | grep -qF '"$request"' || { >&2 echo 'CannLabs guard: stock "$request" is still in log_discourse'; exit 1; }
        - |-
          grep '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf | grep -qF '"$cannlabs_log_referer"' || { >&2 echo 'CannLabs guard: safe Referer is not in log_discourse'; exit 1; }
        - |-
          ! grep '^log_format log_discourse ' /etc/nginx/conf.d/discourse.conf | grep -qF '"$http_referer"' || { >&2 echo 'CannLabs guard: raw "$http_referer" is still in log_discourse'; exit 1; }
        - |-
          grep -qF 'set $cannlabs_log_uri $uri;' /etc/nginx/conf.d/outlets/server/35-cannlabs-log-redaction.conf && grep -qF 'set $cannlabs_log_referer "-";' /etc/nginx/conf.d/outlets/server/35-cannlabs-log-redaction.conf || { >&2 echo 'CannLabs guard: log variable outlet is incomplete'; exit 1; }
        - |-
          test "$(grep -rhE '^[[:space:]]*error_log[[:space:]]' /etc/nginx)" = 'error_log /var/log/nginx/error.log emerg;' || { >&2 echo 'CannLabs guard: the only active error_log must be the emerg line'; exit 1; }
        - |-
          grep -qE '^[[:space:]]*create 0640 www-data www-data$' /etc/logrotate.d/nginx && ! grep -q 'create 0644' /etc/logrotate.d/nginx && grep -qE '^[[:space:]]*rotate 7$' /etc/logrotate.d/nginx || { >&2 echo 'CannLabs guard: nginx logrotate must create 0640 and keep rotate 7'; exit 1; }
        - |-
          test "$(stat -c '%a %U:%G' /var/log/nginx)" = '750 www-data:www-data' && test "$(stat -c '%a %U:%G' /shared/log/rails)" = '750 discourse:www-data' || { >&2 echo 'CannLabs guard: log directories are not 0750 with the runtime owners (nginx www-data:www-data, rails discourse:www-data)'; exit 1; }
        - nginx -t

  - exec: echo "End of custom commands"
